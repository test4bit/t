name: VPN Server (AWG/WARP)
run-name: vpn-${{ inputs.gist_id }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: awg or warp"
        required: true
        type: choice
        options: [warp, awg]
        default: warp
      gist_id:
        description: "Gist ID generated by client"
        required: true
        type: string

# Do not cancel other clients' VPN runs. Each gist has its own group.
concurrency:
  group: vpn-server-${{ inputs.gist_id }}
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-24.04
    steps:
      - name: Download server binary at workflow commit
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/vpn" -o vpn
          chmod +x vpn
      - name: Prepare optional warpscout
        if: ${{ vars.ENABLE_WARP_SCOUT == 'true' && inputs.mode == 'warp' }}
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/warpbin" GOTOOLCHAIN=auto
          mkdir -p "$GOBIN"
          go install github.com/vernette/warpscout@9e2ce9570625757ba24b390ad680dccd5e7f2707
          umask 077
          "$GOBIN/warpscout" register -plain -a "$RUNNER_TEMP/warpscout-account.json"
          echo "WARP_SCOUT_PATH=$GOBIN/warpscout" >> "$GITHUB_ENV"
          echo "WARP_SCOUT_ACCOUNT=$RUNNER_TEMP/warpscout-account.json" >> "$GITHUB_ENV"
      - name: Run Server Logic
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIST_ID: ${{ inputs.gist_id }}
          VPN_MODE: ${{ inputs.mode }}
          VPN_DEBUG_STUN: ${{ vars.VPN_DEBUG_STUN }}
          GH_REPO: ${{ github.repository }}
          WARP_SSH_HOST_KEY: ${{ secrets.WARP_SSH_HOST_KEY }}
          WARP_SSH_PASSWORD: ${{ secrets.WARP_SSH_PASSWORD }}
        run: |
          case "$VPN_MODE" in awg|warp) ;; *) echo 'Invalid mode'; exit 1;; esac
          sudo -E ./vpn -role server -mode "$VPN_MODE" -gist "$GIST_ID"
